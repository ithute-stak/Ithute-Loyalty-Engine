[project]
name = "ithute-loyalty-engine"
version = "0.1.0"
description = "Multi-company loyalty platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-asyncio>=0.24,<2"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["."]
include = ["loyalty_api*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
