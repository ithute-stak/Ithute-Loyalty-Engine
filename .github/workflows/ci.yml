name: Loyalty Engine CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loyalty
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: loyalty
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loyalty -d loyalty"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://loyalty:ci_test_only@127.0.0.1:5432/loyalty
      TEST_RLS_DATABASE_URL: postgresql+asyncpg://loyalty_rls:ci_rls_only@127.0.0.1:5432/loyalty
      TEST_LEDGER_DATABASE_URL: postgresql+asyncpg://loyalty_ledger:ci_ledger_only@127.0.0.1:5432/loyalty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: alembic upgrade head
      - name: Create restricted RLS test role
        run: |
          PGPASSWORD=ci_test_only psql -h 127.0.0.1 -U loyalty -d loyalty -v ON_ERROR_STOP=1 -c "CREATE ROLE loyalty_rls LOGIN PASSWORD 'ci_rls_only'"
          PGPASSWORD=ci_test_only psql -h 127.0.0.1 -U loyalty -d loyalty -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO loyalty_rls; GRANT SELECT, INSERT ON public.branches TO loyalty_rls; GRANT SELECT ON public.company_users, public.loyalty_programmes TO loyalty_rls"
      - name: Provision restricted ledger runtime role
        run: |
          PGPASSWORD=ci_test_only psql -h 127.0.0.1 -U loyalty -d loyalty -v ON_ERROR_STOP=1 -c "CREATE ROLE loyalty_ledger LOGIN PASSWORD 'ci_ledger_only'"
          PGPASSWORD=ci_test_only psql -h 127.0.0.1 -U loyalty -d loyalty -v ON_ERROR_STOP=1 -f infra/postgres/ledger_role.sql
      - name: Require PostgreSQL RLS test configuration
        run: test -n "$TEST_RLS_DATABASE_URL"
      - run: python -m compileall -q loyalty_api tests migrations
      - run: python -m pytest -q
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust ledger PostgreSQL concurrency tests
        env:
          LEDGER_TEST_DATABASE_URL: postgres://loyalty_ledger:ci_ledger_only@127.0.0.1:5432/loyalty
          LEDGER_FIXTURE_DATABASE_URL: postgres://loyalty:ci_test_only@127.0.0.1:5432/loyalty
        run: cargo test --manifest-path services/ledger-rust/Cargo.toml --features postgres --test postgres_concurrency
      - name: Live signed client to Rust ledger and PostgreSQL
        env:
          LEDGER_DATABASE_URL: postgres://loyalty_ledger:ci_ledger_only@127.0.0.1:5432/loyalty
          LEDGER_BIND_ADDRESS: 127.0.0.1:8090
          LEDGER_SIGNING_KEYS_JSON: '[{"id":"ci-a-v1","secret":"ci-test-key-with-at-least-32-characters-1234","tenants":["00000000-0000-4000-8000-000000000001"]}]'
          LEDGER_E2E_OWNER_DATABASE_URL: postgresql+asyncpg://loyalty:ci_test_only@127.0.0.1:5432/loyalty
          LEDGER_E2E_SERVICE_URL: http://127.0.0.1:8090
          LEDGER_E2E_KEY_ID: ci-a-v1
          LEDGER_E2E_KEY_SECRET: ci-test-key-with-at-least-32-characters-1234
          LEDGER_E2E_TENANT_A: 00000000-0000-4000-8000-000000000001
        run: |
          cargo build --manifest-path services/ledger-rust/Cargo.toml --features service
          services/ledger-rust/target/debug/ithute-loyalty-ledger > /tmp/ledger-e2e.log 2>&1 &
          LEDGER_PID=$!
          trap 'kill "$LEDGER_PID" 2>/dev/null || true; cat /tmp/ledger-e2e.log' EXIT
          python - <<'PY'
          import socket, time
          for _ in range(100):
              try:
                  socket.create_connection(("127.0.0.1", 8090), timeout=0.2).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("Rust ledger failed to bind")
          PY
          python -m pytest -q tests/test_ledger_e2e_live.py
      - name: Preserve Rust ledger startup and HTTP test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-e2e-service-log
          path: /tmp/ledger-e2e.log
          if-no-files-found: ignore
      - run: alembic check
      - run: docker build -t loyalty-ci .
      - name: Build private Rust ledger image
        run: docker build -f services/ledger-rust/Dockerfile -t loyalty-ledger-ci .
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_DB: loyalty
          POSTGRES_USER: loyalty
          POSTGRES_PASSWORD: ci_test_only
        run: |
          cp .env.example .env
          docker compose config --quiet
          LEDGER_INTERNAL_KEY=ci-test-only-not-for-production-1234567890 \
          LEDGER_DATABASE_URL=postgres://loyalty:ci_test_only@postgres:5432/loyalty \
          LEDGER_KEY_ID=ci-v1 \
          LEDGER_SIGNING_KEYS_JSON='[{"id":"ci-v1","secret":"ci-test-key-with-at-least-32-characters-1234","tenants":["00000000-0000-4000-8000-000000000001"]}]' \
          docker compose -f compose.yaml -f compose.ledger.yml config --quiet
          rm .env

  rust-ledger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo clippy --all-targets --features service -- -D warnings
      - run: cargo test --all-targets --features service
