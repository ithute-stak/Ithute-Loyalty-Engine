[package]
name = "ithute-loyalty-ledger"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
description = "Pure domain logic for tenant-scoped loyalty point commands"

[lib]
path = "src/lib.rs"

[features]
default = []
postgres = ["dep:sqlx", "dep:tokio", "dep:uuid"]
service = ["postgres", "dep:axum", "dep:serde", "dep:subtle", "dep:hmac", "dep:sha2", "dep:hex", "dep:serde_json", "tokio/net", "tokio/rt-multi-thread"]

[dependencies]
sqlx = { version = "0.7", optional = true, default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid"] }
tokio = { version = "1", optional = true, features = ["rt", "macros"] }
uuid = { version = "1", optional = true, features = ["v4"] }

axum = { version = "0.7", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
subtle = { version = "2", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
serde_json = { version = "1", optional = true }
