# Optional private ledger overlay. Do not expose outside private Docker networking.
# Requires a dedicated DB runtime role and migrations before enabling.
services:
  api:
    environment:
      LEDGER_INTERNAL_URL: http://ledger:8090
      LEDGER_INTERNAL_KEY: ${LEDGER_INTERNAL_KEY:?provide secret in .env}
      LEDGER_KEY_ID: ${LEDGER_KEY_ID:?provide configured key ID}
    depends_on:
      ledger:
        condition: service_started
    networks:
      - default
      - ledger_private
  ledger:
    build:
      context: .
      dockerfile: services/ledger-rust/Dockerfile
    restart: unless-stopped
    environment:
      LEDGER_BIND_ADDRESS: 0.0.0.0:8090
      LEDGER_DATABASE_URL: ${LEDGER_DATABASE_URL:?configure a restricted ledger role}
      LEDGER_SIGNING_KEYS_JSON: ${LEDGER_SIGNING_KEYS_JSON:?provide independently scoped credential JSON}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ledger_private
      - ledger_db
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
  postgres:
    networks:
      - default
      - ledger_db
  # API and ledger share the HTTP-only network; ledger and database share
  # a separate SQL-only network. No published ledger ports.
networks:
  ledger_private:
    internal: true
  ledger_db:
    internal: true
